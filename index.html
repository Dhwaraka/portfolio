<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhwarakesh Vandavasi Balaji — Mechanical Product Engineer</title>
<meta name="description" content="Mechanical Product Engineer specializing in electro-mechanical systems, high-pressure hydrogen dispensing, thermal packaging, and precision fabrication.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --paper: #F4F1EB;
  --paper-2: #EDE8DE;
  --surface: #FBF9F4;
  --ink: #1A1715;
  --ink-2: #2B2724;
  --muted: #6B6560;
  --muted-2: #8E8780;
  --line: #DDD7CB;
  --line-soft: #E8E3D7;
  --accent: #C44518;
  --accent-2: #8B2E0F;
  --slate: #2C3E50;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Geist', system-ui, sans-serif;
  font-weight: 400;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 80px 80px;
  opacity: 0.35;
  pointer-events: none;
  z-index: 1;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}

main, header, footer { position: relative; z-index: 2; }

.mono { font-family: 'JetBrains Mono', monospace; font-weight: 400; letter-spacing: 0.02em; }
h1, h2, h3, h4 { font-family: 'Fraunces', serif; font-weight: 400; line-height: 1.05; letter-spacing: -0.02em; color: var(--ink); }
.label { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

.container { max-width: 1320px; margin: 0 auto; padding: 0 2.5rem; }
@media (max-width: 768px) { .container { padding: 0 1.5rem; } }

/* === NAV === */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(244, 241, 235, 0.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s;
}
nav.scrolled { border-bottom-color: var(--line); }

.nav-inner { max-width: 1320px; margin: 0 auto; padding: 1.25rem 2.5rem; display: flex; align-items: center; justify-content: space-between; }

.logo { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.1rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--ink); }
.logo-mark { width: 32px; height: 32px; border: 1.5px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; font-weight: 600; position: relative; }
.logo-mark::before, .logo-mark::after { content: ''; position: absolute; width: 4px; height: 4px; background: var(--accent); }
.logo-mark::before { top: -2.5px; left: -2.5px; }
.logo-mark::after { bottom: -2.5px; right: -2.5px; }

.nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
.nav-links a { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); text-decoration: none; padding: 0.25rem 0; transition: color 0.2s; }
.nav-links a:hover { color: var(--accent); }
.nav-links a::before { content: attr(data-num); color: var(--muted-2); margin-right: 0.4rem; font-size: 0.68rem; }
.nav-cta { border: 1px solid var(--ink); padding: 0.55rem 1.1rem !important; transition: all 0.2s !important; }
.nav-cta::before { content: none !important; }
.nav-cta:hover { background: var(--ink); color: var(--paper) !important; }

@media (max-width: 768px) {
  .nav-links { gap: 1rem; }
  .nav-links a:not(.nav-cta) { display: none; }
  .nav-inner { padding: 1rem 1.5rem; }
}

/* === HERO === */
.hero { padding: 9rem 0 6rem; position: relative; min-height: 100vh; display: flex; align-items: center; }
.hero-grid { display: grid; grid-template-columns: 1fr; gap: 3rem; width: 100%; }
.hero-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; }
.meta-item .label { display: block; margin-bottom: 0.4rem; }
.meta-item .value { font-family: 'Geist', sans-serif; font-size: 0.95rem; color: var(--ink); font-weight: 500; }
.meta-item .value.accent { color: var(--accent); }
@media (max-width: 768px) { .hero-meta { grid-template-columns: repeat(2, 1fr); gap: 1.5rem; } }

.hero-title { font-size: clamp(3.5rem, 9.5vw, 9rem); line-height: 0.92; letter-spacing: -0.045em; font-weight: 300; font-variation-settings: "opsz" 144, "SOFT" 50; }
.hero-title .accent-text { font-style: italic; font-variation-settings: "opsz" 144, "SOFT" 100; color: var(--accent); font-weight: 400; }
.hero-title .small { font-size: 0.45em; display: block; color: var(--muted); font-style: normal; letter-spacing: -0.02em; margin-top: 0.5rem; font-weight: 400; font-variation-settings: "opsz" 144, "SOFT" 0; }

.hero-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; margin-top: 3rem; align-items: end; }
@media (max-width: 880px) { .hero-bottom { grid-template-columns: 1fr; gap: 2rem; } }

.hero-intro { font-size: 1.15rem; line-height: 1.55; color: var(--ink-2); max-width: 540px; }
.hero-intro strong { color: var(--ink); font-weight: 500; }

.hero-cta-group { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 880px) { .hero-cta-group { justify-content: flex-start; } }

.btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.4rem; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--ink); color: var(--ink); background: transparent; transition: all 0.2s ease; cursor: pointer; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); }
.btn .arrow { transition: transform 0.2s; display: inline-block; }
.btn:hover .arrow { transform: translateX(3px); }

.hero-annotation { position: absolute; right: 2.5rem; top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: right center; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted-2); white-space: nowrap; }
@media (max-width: 1100px) { .hero-annotation { display: none; } }

/* === SECTION HEADERS === */
.section { padding: 6rem 0; position: relative; }
.section-header { display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: end; padding-bottom: 2.5rem; margin-bottom: 4rem; border-bottom: 1px solid var(--line); }
.section-num { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--accent); letter-spacing: 0.1em; font-weight: 500; }
.section-title { font-size: clamp(2.2rem, 5vw, 3.8rem); line-height: 1; font-weight: 300; font-variation-settings: "opsz" 144, "SOFT" 40; }
.section-title em { font-style: italic; color: var(--accent); font-variation-settings: "opsz" 144, "SOFT" 100; }
.section-tagline { grid-column: 2; font-size: 1rem; color: var(--muted); max-width: 500px; justify-self: end; text-align: right; }
@media (max-width: 768px) { .section-header { grid-template-columns: 1fr; gap: 1rem; } .section-tagline { grid-column: 1; text-align: left; justify-self: start; } }

/* === STATS === */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 3rem; }
@media (max-width: 768px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { padding: 2rem 1.5rem; border: 1px solid var(--line); background: var(--surface); position: relative; transition: all 0.3s; }
.stat:hover { border-color: var(--ink); transform: translateY(-2px); }
.stat-num { font-family: 'Fraunces', serif; font-size: 3rem; line-height: 1; font-weight: 300; font-variation-settings: "opsz" 144, "SOFT" 30; margin-bottom: 0.5rem; }
.stat-num .unit { font-size: 1.5rem; color: var(--accent); font-style: italic; font-variation-settings: "opsz" 144, "SOFT" 100; }
.stat-label { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); line-height: 1.4; }

.about-content { display: grid; grid-template-columns: 1fr 1.5fr; gap: 5rem; align-items: start; }
@media (max-width: 880px) { .about-content { grid-template-columns: 1fr; gap: 2rem; } }
.about-quote { font-family: 'Fraunces', serif; font-size: 1.8rem; line-height: 1.25; font-weight: 300; font-variation-settings: "opsz" 144, "SOFT" 60; color: var(--ink); position: relative; padding-left: 1.5rem; border-left: 2px solid var(--accent); }
.about-quote em { font-style: italic; color: var(--accent); font-variation-settings: "opsz" 144, "SOFT" 100; }
.about-text p { font-size: 1.05rem; line-height: 1.7; color: var(--ink-2); margin-bottom: 1.2rem; }

/* === SELECTED WORK === */
.work-grid { display: flex; flex-direction: column; gap: 6rem; }
.project { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
.project.reversed .project-visual { order: 2; }
@media (max-width: 880px) { .project { grid-template-columns: 1fr; gap: 2rem; } .project.reversed .project-visual { order: 0; } }

.project-visual {
  aspect-ratio: 4/3;
  background: var(--surface);
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
  transition: transform 0.4s;
}
.project-visual:hover { transform: translateY(-4px); }

.project-visual.has-placeholder::before {
  content: '';
  position: absolute; inset: 0;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 24px 24px; opacity: 0.5;
}

.project-visual-inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2rem; }

.project-visual-corner { position: absolute; top: 1rem; left: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; z-index: 4; background: rgba(244,241,235,0.7); padding: 2px 6px; backdrop-filter: blur(4px); }
.project-visual-corner-r { position: absolute; top: 1rem; right: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; z-index: 4; background: rgba(244,241,235,0.7); padding: 2px 6px; backdrop-filter: blur(4px); }

.project-svg { width: 80%; height: 80%; max-width: 360px; }
.project-svg * { vector-effect: non-scaling-stroke; }

/* === SLIDER === */
.slider { position: absolute; inset: 0; overflow: hidden; }
.slider-track { display: flex; height: 100%; width: 100%; transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1); }
.slide { flex: 0 0 100%; height: 100%; position: relative; }
.slide img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }

.slider-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 42px; height: 42px;
  background: rgba(244, 241, 235, 0.9);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border: 1px solid var(--ink);
  color: var(--ink);
  font-family: 'Fraunces', serif;
  font-size: 1.4rem;
  cursor: pointer;
  z-index: 3;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  padding: 0;
  line-height: 1;
}
.slider-btn:hover { background: var(--ink); color: var(--paper); }
.slider-btn:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.slider-prev { left: 12px; }
.slider-next { right: 12px; }

.slider-dots {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 3;
  padding: 6px 10px;
  background: rgba(244, 241, 235, 0.7);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-radius: 20px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(26,23,21,0.3); border: none; padding: 0; cursor: pointer; transition: all 0.2s; }
.dot:hover { background: rgba(26,23,21,0.6); }
.dot.active { background: var(--accent); transform: scale(1.3); }

.slider-counter {
  position: absolute; bottom: 14px; right: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  color: var(--ink);
  background: rgba(244, 241, 235, 0.85);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding: 4px 8px;
  letter-spacing: 0.06em;
  z-index: 3;
}

/* Smaller slider for personal cards */
.personal-visual .slider-btn { width: 30px; height: 30px; font-size: 1rem; }
.personal-visual .slider-prev { left: 6px; }
.personal-visual .slider-next { right: 6px; }
.personal-visual .slider-dots { bottom: 8px; padding: 4px 7px; gap: 5px; }
.personal-visual .dot { width: 5px; height: 5px; }
.personal-visual .slider-counter { display: none; }

/* === PROJECT CONTENT === */
.project-content { padding: 1rem 0; }
.project-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.6rem; }
.project-tag::before { content: ''; width: 24px; height: 1px; background: var(--accent); }
.project-title { font-size: clamp(1.8rem, 3vw, 2.5rem); line-height: 1.05; font-weight: 300; font-variation-settings: "opsz" 144, "SOFT" 40; margin-bottom: 1rem; }
.project-title em { font-style: italic; color: var(--accent); font-variation-settings: "opsz" 144, "SOFT" 100; }
.project-desc { font-size: 1rem; line-height: 1.65; color: var(--muted); margin-bottom: 1.5rem; }
.project-specs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem 2rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
.spec .label { display: block; margin-bottom: 0.3rem; font-size: 0.65rem; }
.spec-value { font-family: 'Geist', sans-serif; font-size: 0.92rem; color: var(--ink); font-weight: 500; }
.spec-value em { font-family: 'Fraunces', serif; font-style: italic; color: var(--accent); font-variation-settings: "opsz" 144, "SOFT" 100; }

/* === PERSONAL CARDS === */
.personal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
@media (max-width: 880px) { .personal-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .personal-grid { grid-template-columns: 1fr; } }
.personal-card { border: 1px solid var(--line); background: var(--surface); padding: 1.75rem; transition: all 0.3s; display: flex; flex-direction: column; gap: 1rem; position: relative; overflow: hidden; }
.personal-card:hover { border-color: var(--ink); transform: translateY(-3px); }
.personal-card::after { content: ''; position: absolute; top: 0; right: 0; width: 40px; height: 40px; background: linear-gradient(135deg, transparent 49%, var(--accent) 49%, var(--accent) 51%, transparent 51%); opacity: 0; transition: opacity 0.3s; }
.personal-card:hover::after { opacity: 1; }
.personal-visual { aspect-ratio: 1.4/1; background: var(--paper-2); border: 1px solid var(--line); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.personal-visual.has-placeholder::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 16px 16px; opacity: 0.4; }
.personal-svg { width: 70%; max-width: 140px; height: 70%; position: relative; z-index: 1; }
.personal-num { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.12em; }
.personal-title { font-family: 'Fraunces', serif; font-size: 1.25rem; line-height: 1.15; font-weight: 400; font-variation-settings: "opsz" 144, "SOFT" 40; }
.personal-desc { font-size: 0.88rem; line-height: 1.55; color: var(--muted); }
.personal-meta { display: flex; justify-content: space-between; padding-top: 0.8rem; border-top: 1px dashed var(--line); margin-top: auto; }
.personal-meta-item { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--ink-2); letter-spacing: 0.03em; }
.personal-meta-item span { color: var(--muted-2); }

/* === TIMELINE === */
.timeline { display: flex; flex-direction: column; gap: 3rem; }
.tl-entry { display: grid; grid-template-columns: 200px 1fr; gap: 2rem; padding-bottom: 3rem; border-bottom: 1px solid var(--line); }
.tl-entry:last-child { border-bottom: none; padding-bottom: 0; }
@media (max-width: 768px) { .tl-entry { grid-template-columns: 1fr; gap: 1rem; } }
.tl-date { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; letter-spacing: 0.06em; color: var(--muted); line-height: 1.5; padding-top: 0.4rem; }
.tl-date strong { color: var(--ink); display: block; font-weight: 500; margin-bottom: 0.25rem; }
.tl-role { font-family: 'Fraunces', serif; font-size: 1.65rem; line-height: 1.15; font-weight: 400; font-variation-settings: "opsz" 144, "SOFT" 30; margin-bottom: 0.4rem; }
.tl-company { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--accent); letter-spacing: 0.04em; margin-bottom: 1.2rem; }
.tl-bullets { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
.tl-bullets li { font-size: 0.96rem; line-height: 1.6; color: var(--ink-2); padding-left: 1.5rem; position: relative; }
.tl-bullets li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 500; }
.tl-bullets li strong { color: var(--ink); font-weight: 500; }

/* === SKILLS === */
.skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2.5rem; }
@media (max-width: 768px) { .skills-grid { grid-template-columns: 1fr; gap: 2rem; } }
.skill-block { padding: 2rem; border: 1px solid var(--line); background: var(--surface); position: relative; }
.skill-block::before { content: ''; position: absolute; top: 0; left: 0; width: 30px; height: 2px; background: var(--accent); }
.skill-block-title { font-family: 'Fraunces', serif; font-size: 1.35rem; line-height: 1.1; font-weight: 400; margin-bottom: 0.4rem; font-variation-settings: "opsz" 144, "SOFT" 40; }
.skill-block-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; }
.skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.skill-tag { padding: 0.4rem 0.8rem; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--ink-2); border: 1px solid var(--line); background: var(--paper); transition: all 0.2s; cursor: default; }
.skill-tag:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.skill-tag.featured { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.skill-tag.featured:hover { background: var(--accent); border-color: var(--accent); color: var(--paper); }

/* === CONTACT === */
.contact-section { padding: 8rem 0; background: var(--ink); color: var(--paper); margin-top: 6rem; position: relative; overflow: hidden; }
.contact-section::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
.contact-section .container { position: relative; }
.contact-label { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem; }
.contact-title { font-size: clamp(2.8rem, 7vw, 6rem); line-height: 0.95; font-weight: 300; letter-spacing: -0.03em; margin-bottom: 2rem; color: var(--paper); font-variation-settings: "opsz" 144, "SOFT" 50; max-width: 900px; }
.contact-title em { font-style: italic; color: var(--accent); font-variation-settings: "opsz" 144, "SOFT" 100; }
.contact-sub { font-size: 1.15rem; color: rgba(244, 241, 235, 0.65); max-width: 580px; margin-bottom: 3rem; line-height: 1.6; }
.contact-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-top: 3rem; padding-top: 3rem; border-top: 1px solid rgba(255,255,255,0.1); }
@media (max-width: 768px) { .contact-grid { grid-template-columns: repeat(2, 1fr); } }
.contact-item .label { color: var(--muted-2); display: block; margin-bottom: 0.5rem; }
.contact-item a { color: var(--paper); text-decoration: none; font-family: 'Geist', sans-serif; font-size: 0.98rem; font-weight: 500; transition: color 0.2s; word-break: break-word; }
.contact-item a:hover { color: var(--accent); }
.contact-cta-row { display: flex; gap: 1rem; flex-wrap: wrap; }
.btn-dark { border-color: rgba(244, 241, 235, 0.3); color: var(--paper); }
.btn-dark:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.btn-dark.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn-dark.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--paper); }

/* ============================================================
   SLIDER — vanilla JS, supports arrows / dots / swipe / keyboard
   ============================================================ */
function buildSlider(images, placeholderKey, small = false) {
  if (!images || images.length === 0) {
    return `<div class="project-visual-inner">${placeholders[placeholderKey] || ''}</div>`;
  }
  const slides = images.map(src => `<div class="slide"><img src="${src}" alt="" loading="lazy"></div>`).join('');
  const dots = images.map((_, i) => `<button class="dot${i === 0 ? ' active' : ''}" data-index="${i}" aria-label="Go to slide ${i + 1}"></button>`).join('');
  const showControls = images.length > 1;
  return `
    <div class="slider" tabindex="0">
      <div class="slider-track">${slides}</div>
      ${showControls ? `
        <button class="slider-btn slider-prev" aria-label="Previous image">‹</button>
        <button class="slider-btn slider-next" aria-label="Next image">›</button>
        <div class="slider-dots">${dots}</div>
        ${!small ? `<div class="slider-counter">1 / ${images.length}</div>` : ''}
      ` : ''}
    </div>
  `;
}

function activateSlider(container) {
  const track = container.querySelector('.slider-track');
  if (!track) return;
  const slides = container.querySelectorAll('.slide');
  const total = slides.length;
  if (total <= 1) return;

  const dots = container.querySelectorAll('.dot');
  const counter = container.querySelector('.slider-counter');
  const prevBtn = container.querySelector('.slider-prev');
  const nextBtn = container.querySelector('.slider-next');
  let current = 0;

  function go(i) {
    current = (i + total) % total;
    track.style.transform = `translateX(-${current * 100}%)`;
    dots.forEach((d, idx) => d.classList.toggle('active', idx === current));
    if (counter) counter.textContent = `${current + 1} / ${total}`;
  }

  prevBtn && prevBtn.addEventListener('click', e => { e.stopPropagation(); go(current - 1); });
  nextBtn && nextBtn.addEventListener('click', e => { e.stopPropagation(); go(current + 1); });
  dots.forEach((dot, i) => dot.addEventListener('click', e => { e.stopPropagation(); go(i); }));

  // Touch swipe
  let startX = 0, deltaX = 0, dragging = false;
  track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; dragging = true; }, { passive: true });
  track.addEventListener('touchmove', e => { if (dragging) deltaX = e.touches[0].clientX - startX; }, { passive: true });
  track.addEventListener('touchend', () => {
    if (dragging && Math.abs(deltaX) > 50) {
      if (deltaX < 0) go(current + 1); else go(current - 1);
    }
    dragging = false; deltaX = 0;
  });

  // Keyboard
  container.querySelector('.slider').addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(current - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); go(current + 1); }
  });
}

// Nav scroll state
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  if (window.scrollY > 20) nav.classList.add('scrolled');
  else nav.classList.remove('scrolled');
});

// Reveal animations
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => {
  observer.observe(el);
  // Failsafe: if element is already in view on load, show it immediately
  const rect = el.getBoundingClientRect();
  if (rect.top < window.innerHeight && rect.bottom > 0) {
    el.classList.add('in-view');
  }
});

// Failsafe: after 1.5 seconds, force-show anything still hidden
setTimeout(() => {
  document.querySelectorAll('.reveal:not(.in-view), .reveal-stagger:not(.in-view)').forEach(el => {
    el.classList.add('in-view');
  });
}, 1500);

// document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => observer.observe(el));

// Smooth scroll
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
  anchor.addEventListener('click', function (e) {
    const target = document.querySelector(this.getAttribute('href'));
    if (target && this.getAttribute('href') !== '#') {
      e.preventDefault();
      const y = target.getBoundingClientRect().top + window.pageYOffset - 60;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  });
});
</script>
